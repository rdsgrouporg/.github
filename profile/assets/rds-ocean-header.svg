  <rect width="1600" height="420" fill="url(#ocean)"/>
  <ellipse cx="1200" cy="100" rx="500" ry="220" fill="url(#glow)"/>

  <path d="M0 180 C220 100 390 260 650 180 S1100 80 1350 170 S1500 210 1600 130 L1600 420 L0 420Z"
