    <circle cx="360" cy="70" r="1.5"/>
    <circle cx="1250" cy="85" r="2"/>
    <circle cx="1450" cy="145" r="1.5"/>
    <circle cx="1050" cy="55" r="1"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="800" y="175" fill="#FFFFFF" font-size="64"
